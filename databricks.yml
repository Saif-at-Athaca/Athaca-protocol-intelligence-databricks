# Databricks Asset Bundle — Protocol Intelligence POC
# Validate locally: databricks bundle validate

bundle:
  name: protocol-intelligence-databricks

variables:
  catalog:
    description: Unity Catalog name (J07)
    default: pi
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  public_schema:
    default: public
  outputs_schema:
    default: outputs

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${env.DATABRICKS_HOST}

  prod:
    mode: production
    workspace:
      host: ${env.DATABRICKS_HOST}
