# Databricks Asset Bundle — Protocol Intelligence POC
# Host comes from DATABRICKS_HOST (do not set workspace.host in targets).
# Validate: databricks bundle validate -t dev

bundle:
  name: protocol-intelligence-databricks

variables:
  catalog:
    description: Unity Catalog name (J07)
    default: pi
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  public_schema:
    default: public
  outputs_schema:
    default: outputs
  restricted_schema:
    default: restricted_test

include:
  - resources/*.yml

sync:
  paths:
    - notebooks
    - docs

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Shared/pi-poc/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: pi-poc-deployer
